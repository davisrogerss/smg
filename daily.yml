name: Daily trade signals

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 8:00 AM Eastern, weekdays
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install yfinance pandas

      - name: Decide
        run: python signals.py

      - name: Save updated holdings
        run: |
          if ! git diff --quiet holdings.json; then
            git config user.name "smg-bot"
            git config user.email "smg-bot@users.noreply.github.com"
            git add holdings.json
            git commit -m "Trades $(date +%Y-%m-%d)"
            git push
          fi

      - name: Notify me
        if: hashFiles('report.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Trades for $(date +%b\ %-d)" \
            --body-file report.txt \
            --repo ${{ github.repository }}
